{% extends 'core/base.html' %}
{% block contenido %}
<div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; margin: 40px auto; border-top: 6px solid #0B2545;">
    <h2 style="color: #0B2545; text-align: center; margin-bottom: 20px;">Crear Nueva Contraseña</h2>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Nueva Contraseña:</label>
                <input type="password" name="new_password1" class="form-control" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label>Confirmar Contraseña:</label>
                <input type="password" name="new_password2" class="form-control" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <button type="submit" class="btn-dorado" style="width: 100%; padding: 12px;">Cambiar Contraseña</button>
        </form>
    {% else %}
        <p style="color: red; text-align: center;">El enlace de recuperación es inválido o ya ha expirado. Por favor, solicita uno nuevo.</p>
    {% endif %}
</div>
{% endblock %}
