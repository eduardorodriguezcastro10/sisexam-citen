{% extends 'core/base.html' %}
{% block contenido %}
<div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; margin: 40px auto; text-align: center; border-top: 6px solid #2e7d32;">
    <i class="fa-solid fa-envelope-circle-check" style="font-size: 50px; color: #2e7d32; margin-bottom: 20px;"></i>
    <h2 style="color: #0B2545;">¡Correo Enviado!</h2>
    <p style="color: #666;">Hemos enviado un enlace de recuperación a tu correo. Revisa tu bandeja de entrada (y la carpeta de spam).</p>
    <a href="{% url 'login' %}" class="btn-dorado" style="display: inline-block; margin-top: 20px; padding: 10px 20px; text-decoration: none;">Volver al Login</a>
</div>
{% endblock %}
